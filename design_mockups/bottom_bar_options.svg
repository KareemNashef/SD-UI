<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040">
  <rect width="1400" height="1040" fill="#211e18"/>
  <text x="70" y="72" fill="#eee4cf" font-family="Arial, sans-serif" font-size="34" font-weight="700">Bottom bar directions</text>
  <text x="70" y="108" fill="#bdb49f" font-family="Arial, sans-serif" font-size="18">Four ways to reduce the visual weight of the current floating controls</text>

  <g transform="translate(70 150)">
    <rect width="600" height="370" rx="24" fill="#dcd2bb" stroke="#0e0d0b" stroke-width="5"/>
    <text x="28" y="44" fill="#181612" font-family="Arial, sans-serif" font-size="22" font-weight="700">A  Compact command row</text>
    <text x="28" y="72" fill="#605a4e" font-family="Arial, sans-serif" font-size="16">Everything stays visible; the bar becomes one calm strip.</text>
    <rect x="28" y="190" width="544" height="112" rx="18" fill="#eee5d2" stroke="#171511" stroke-width="4"/>
    <rect x="48" y="214" width="112" height="60" rx="14" fill="#d2c7ae"/>
    <text x="70" y="252" fill="#29251e" font-family="Arial" font-size="18">Prompts</text>
    <rect x="174" y="214" width="100" height="60" rx="14" fill="#db573c"/>
    <text x="198" y="252" fill="#fff1de" font-family="Arial" font-size="18">Write</text>
    <rect x="288" y="214" width="120" height="60" rx="14" fill="#d2c7ae"/>
    <text x="309" y="252" fill="#29251e" font-family="Arial" font-size="18">Describe</text>
    <rect x="422" y="214" width="130" height="60" rx="14" fill="#746d5d"/>
    <text x="451" y="252" fill="#fff1de" font-family="Arial" font-size="18">Generate</text>
  </g>

  <g transform="translate(730 150)">
    <rect width="600" height="370" rx="24" fill="#dcd2bb" stroke="#0e0d0b" stroke-width="5"/>
    <text x="28" y="44" fill="#181612" font-family="Arial, sans-serif" font-size="22" font-weight="700">B  Primary action</text>
    <text x="28" y="72" fill="#605a4e" font-family="Arial, sans-serif" font-size="16">Make Generate unmistakably dominant.</text>
    <rect x="28" y="190" width="544" height="112" rx="18" fill="#eee5d2" stroke="#171511" stroke-width="4"/>
    <rect x="48" y="214" width="112" height="60" rx="14" fill="#d2c7ae"/>
    <text x="76" y="252" fill="#29251e" font-family="Arial" font-size="18">Prompts</text>
    <rect x="174" y="214" width="70" height="60" rx="14" fill="#d2c7ae"/>
    <text x="202" y="252" fill="#29251e" font-family="Arial" font-size="22">⋮</text>
    <rect x="258" y="204" width="294" height="80" rx="18" fill="#db573c" stroke="#a73d2b" stroke-width="3"/>
    <text x="326" y="253" fill="#fff1de" font-family="Arial" font-size="24" font-weight="700">▶  Generate</text>
  </g>

  <g transform="translate(70 600)">
    <rect width="600" height="370" rx="24" fill="#dcd2bb" stroke="#0e0d0b" stroke-width="5"/>
    <text x="28" y="44" fill="#181612" font-family="Arial, sans-serif" font-size="22" font-weight="700">C  Grouped controls</text>
    <text x="28" y="72" fill="#605a4e" font-family="Arial, sans-serif" font-size="16">Separate prompt tools from image actions.</text>
    <rect x="28" y="178" width="250" height="130" rx="18" fill="#eee5d2" stroke="#171511" stroke-width="4"/>
    <text x="52" y="210" fill="#746d5d" font-family="Arial" font-size="14" font-weight="700">PROMPT</text>
    <rect x="48" y="230" width="94" height="54" rx="12" fill="#db573c"/><text x="70" y="264" fill="#fff1de" font-family="Arial" font-size="17">Write</text>
    <rect x="152" y="230" width="106" height="54" rx="12" fill="#d2c7ae"/><text x="166" y="264" fill="#29251e" font-family="Arial" font-size="17">Describe</text>
    <rect x="300" y="178" width="272" height="130" rx="18" fill="#eee5d2" stroke="#171511" stroke-width="4"/>
    <text x="324" y="210" fill="#746d5d" font-family="Arial" font-size="14" font-weight="700">IMAGE</text>
    <rect x="320" y="230" width="108" height="54" rx="12" fill="#d2c7ae"/><text x="340" y="264" fill="#29251e" font-family="Arial" font-size="17">Tools</text>
    <rect x="438" y="230" width="112" height="54" rx="12" fill="#746d5d"/><text x="456" y="264" fill="#fff1de" font-family="Arial" font-size="17">Generate</text>
  </g>

  <g transform="translate(730 600)">
    <rect width="600" height="370" rx="24" fill="#dcd2bb" stroke="#0e0d0b" stroke-width="5"/>
    <text x="28" y="44" fill="#181612" font-family="Arial, sans-serif" font-size="22" font-weight="700">D  Tool dock</text>
    <text x="28" y="72" fill="#605a4e" font-family="Arial, sans-serif" font-size="16">Keep the canvas clean; reveal tools on demand.</text>
    <rect x="28" y="190" width="544" height="112" rx="18" fill="#eee5d2" stroke="#171511" stroke-width="4"/>
    <rect x="48" y="214" width="70" height="60" rx="14" fill="#d2c7ae"/><text x="77" y="252" fill="#29251e" font-family="Arial" font-size="22">⋮</text>
    <text x="140" y="248" fill="#605a4e" font-family="Arial" font-size="16">Prompt &amp; image tools</text>
    <rect x="384" y="204" width="168" height="80" rx="18" fill="#db573c" stroke="#a73d2b" stroke-width="3"/>
    <text x="426" y="253" fill="#fff1de" font-family="Arial" font-size="22" font-weight="700">▶  Generate</text>
  </g>
</svg>
