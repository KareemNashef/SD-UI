name: sd_companion
description: "Aperture — a Liquid Glass interface for Forge Neo and ComfyUI generation."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  cached_network_image: ^3.4.1
  dio: ^5.9.0
  flutter:
    sdk: flutter
  http: ^1.2.2
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.1
  path_provider: ^2.1.3
  flutter_launcher_icons: ^0.14.4
  image: ^4.7.2
  file_picker: ^8.1.6
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/placeholders/
    - assets/comfy/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 500
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 700
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 800
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 700