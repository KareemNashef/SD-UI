name: sd_companion
description: "Aperture — a Liquid Glass interface for Forge Neo and ComfyUI generation."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  cached_network_image: ^3.4.1
  dio: ^5.9.0
  flutter:
    sdk: flutter
  http: ^1.2.2
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.1
  path_provider: ^2.1.3
  flutter_launcher_icons: ^0.14.4
  image: ^4.7.2
  file_picker: ^8.1.6
  scrollable_positioned_list: ^0.3.8
  liquid_glass_renderer: ^0.2.0-dev.4

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true


  assets:
    - assets/icon/
    - assets/placeholders/
    - assets/comfy/

  fonts:
    # Geist for UI, Geist Mono for every number the app shows (steps, CFG,
    # seeds, resolutions, percentages) - tabular figures keep parameter
    # columns aligned and stop live counters from jittering as they tick.
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Variable.ttf
          weight: 400
        - asset: assets/fonts/Geist-Variable.ttf
          weight: 500
        - asset: assets/fonts/Geist-Variable.ttf
          weight: 600
        - asset: assets/fonts/Geist-Variable.ttf
          weight: 700
        - asset: assets/fonts/Geist-Variable.ttf
          weight: 800
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Variable.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Variable.ttf
          weight: 500
        - asset: assets/fonts/GeistMono-Variable.ttf
          weight: 700